<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Pong</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b18;
      --panel: rgba(18, 24, 48, 0.88);
      --cyan: #62f4ff;
      --pink: #ff6bd6;
      --text: #e9efff;
      --muted: #9da8c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, #19214d 0, transparent 35%),
        radial-gradient(circle at 90% 90%, #321440 0, transparent 38%),
        var(--bg);
    }

    main {
      width: min(94vw, 900px);
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      backdrop-filter: blur(12px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 { margin: 0; letter-spacing: .12em; font-size: clamp(1.3rem, 3vw, 2rem); }
    .subtitle { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }

    .scoreboard {
      display: flex;
      gap: 1rem;
      text-align: center;
    }

    .score { min-width: 4.5rem; }
    .score strong { display: block; font-size: 2rem; line-height: 1; }
    .score span { color: var(--muted); font-size: .72rem; letter-spacing: .14em; }
    .player strong { color: var(--cyan); }
    .computer strong { color: var(--pink); }

    .game-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: #070a16;
    }

    canvas { display: block; width: 100%; height: auto; aspect-ratio: 800 / 460; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
    }

    .message {
      padding: 1rem 1.3rem;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(8,11,24,.82);
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .message b { display: block; margin-bottom: .35rem; font-size: 1.2rem; }
    .message small { color: var(--muted); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1rem;
      color: var(--muted);
      font-size: .85rem;
    }

    button {
      cursor: pointer;
      padding: .6rem .9rem;
      border: 1px solid rgba(98,244,255,.45);
      border-radius: 8px;
      color: var(--text);
      background: rgba(98,244,255,.1);
      font: inherit;
    }

    button:hover { background: rgba(98,244,255,.2); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>NEON PONG</h1>
        <p class="subtitle">First to 7 points wins</p>
      </div>
      <div class="scoreboard" aria-label="Score">
        <div class="score player"><strong id="playerScore">0</strong><span>YOU</span></div>
        <div class="score computer"><strong id="computerScore">0</strong><span>CPU</span></div>
      </div>
    </header>

    <div class="game-wrap">
      <canvas id="game" width="800" height="460" aria-label="Pong game"></canvas>
      <div class="overlay" id="overlay">
        <div class="message">
          <b>Press Space to start</b>
          <small>Move with W/S or ↑/↓</small>
        </div>
      </div>
    </div>

    <footer>
      <span>W/S or arrow keys to move · Space to pause</span>
      <button id="restart" type="button">Restart game</button>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const playerScore = document.getElementById("playerScore");
    const computerScore = document.getElementById("computerScore");
    const restartButton = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;
    const paddle = { width: 12, height: 82, speed: 7 };
    const player = { x: 28, y: H / 2 - paddle.height / 2, dy: 0 };
    const cpu = { x: W - 40, y: H / 2 - paddle.height / 2 };
    const ball = { x: W / 2, y: H / 2, size: 12, dx: 5, dy: 3 };
    const keys = new Set();
    let scores = { player: 0, cpu: 0 };
    let running = false;
    let gameOver = false;

    function resetBall(direction = Math.random() > .5 ? 1 : -1) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.dx = direction * 5;
      ball.dy = (Math.random() * 4 - 2) || 1.5;
    }

    function resetGame() {
      scores = { player: 0, cpu: 0 };
      playerScore.textContent = "0";
      computerScore.textContent = "0";
      player.y = cpu.y = H / 2 - paddle.height / 2;
      gameOver = false;
      running = false;
      resetBall();
      showOverlay("Press Space to start", "Move with W/S or ↑/↓");
    }

    function showOverlay(title, hint) {
      overlay.style.display = "grid";
      overlay.querySelector("b").textContent = title;
      overlay.querySelector("small").textContent = hint;
    }

    function hideOverlay() { overlay.style.display = "none"; }

    function score(winner) {
      scores[winner]++;
      playerScore.textContent = scores.player;
      computerScore.textContent = scores.cpu;
      if (scores[winner] >= 7) {
        gameOver = true;
        running = false;
        showOverlay(winner === "player" ? "You win!" : "CPU wins", "Press Restart to play again");
      } else {
        resetBall(winner === "player" ? 1 : -1);
      }
    }

    function update() {
      if (!running || gameOver) return;
      if (keys.has("ArrowUp") || keys.has("w")) player.y -= paddle.speed;
      if (keys.has("ArrowDown") || keys.has("s")) player.y += paddle.speed;
      player.y = Math.max(0, Math.min(H - paddle.height, player.y));

      const target = ball.y - paddle.height / 2;
      cpu.y += Math.sign(target - cpu.y) * Math.min(4.2, Math.abs(target - cpu.y));
      cpu.y = Math.max(0, Math.min(H - paddle.height, cpu.y));

      ball.x += ball.dx;
      ball.y += ball.dy;
      if (ball.y <= 0 || ball.y + ball.size >= H) ball.dy *= -1;

      const hitsPlayer = ball.x <= player.x + paddle.width &&
        ball.x + ball.size >= player.x && ball.y + ball.size >= player.y && ball.y <= player.y + paddle.height;
      const hitsCpu = ball.x + ball.size >= cpu.x &&
        ball.x <= cpu.x + paddle.width && ball.y + ball.size >= cpu.y && ball.y <= cpu.y + paddle.height;
      if (hitsPlayer && ball.dx < 0) {
        ball.dx = Math.min(9, Math.abs(ball.dx) + .25);
        ball.dy += (ball.y - (player.y + paddle.height / 2)) * .08;
      }
      if (hitsCpu && ball.dx > 0) {
        ball.dx = -Math.min(9, Math.abs(ball.dx) + .25);
        ball.dy += (ball.y - (cpu.y + paddle.height / 2)) * .08;
      }
      if (ball.x < -ball.size) score("cpu");
      if (ball.x > W) score("player");
    }

    function draw() {
      ctx.fillStyle = "#070a16";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,.16)";
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.shadowBlur = 18;
      ctx.shadowColor = "#62f4ff";
      ctx.fillStyle = "#62f4ff";
      ctx.fillRect(player.x, player.y, paddle.width, paddle.height);
      ctx.shadowColor = "#ff6bd6";
      ctx.fillStyle = "#ff6bd6";
      ctx.fillRect(cpu.x, cpu.y, paddle.width, paddle.height);
      ctx.shadowColor = "#ffffff";
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", " "].includes(event.key.toLowerCase()) || ["w", "s"].includes(key)) {
        event.preventDefault();
      }
      if (event.code === "Space") {
        if (!gameOver) {
          running = !running;
          if (running) hideOverlay();
          else showOverlay("Paused", "Press Space to resume");
        }
      } else {
        keys.add(key);
      }
    });

    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    restartButton.addEventListener("click", resetGame);
    resetGame();
    loop();
  </script>
</body>
</html>
